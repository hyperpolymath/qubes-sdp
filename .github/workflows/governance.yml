# This workflow is managed by gh actions-lock.
# This workflow is managed by gh actions-lock.
# governance.yml — single wrapper calling the shared estate governance bundle
# in hyperpolymath/standards instead of carrying per-repo copies.
#
# Replaces the per-repo governance scaffolding removed in the same commit:
#   quality.yml, guix-nix-policy.yml, npm-bun-blocker.yml, ts-blocker.yml,
#   security-policy.yml, rsr-antipattern.yml, wellknown-enforcement.yml,
#   workflow-linter.yml
#
# Load-bearing build/security workflows stay standalone in the repo
# (rust-ci, codeql, dependabot, release, scan/mirror/pages plumbing).

name: Governance

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Estate guardrail: cancel superseded runs so re-pushes / rebased PR
# updates do not pile up queued runs against the shared account-wide
# Actions concurrency pool. Applied only to read-only check workflows
# (no publish/mutation), so cancelling a superseded run is always safe.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  governance:
    # Pin bumped 84355587 -> a9a3281d (standards@main, 2026-10-04).
    #
    # Why: the pinned revision carried a `Check SHA-pinned actions` step that
    # ran `bash scripts/update-actions-lock.sh --verify-local` from the CALLER
    # tree. That script only exists in hyperpolymath/standards' own tree, so
    # for every consumer the step died with exit 127 before it ever looked at
    # a pin -- and it demanded inline SHA pins on top of a lockfile, which is
    # the opposite of the model this repo uses. standards has since moved that
    # gate into its own `Actions lockfile verify` job, staging both scripts
    # from the pinned checkout instead of assuming the caller has them, and
    # made a present lockfile sufficient on its own.
    uses: hyperpolymath/standards/.github/workflows/governance-reusable.yml@a9a3281d620bdd195369c9a6f0bc1d661910965a
    permissions:
      actions: read
      contents: read
      security-events: write
