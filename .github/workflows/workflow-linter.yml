# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Prevention workflow - validates all workflows have proper security config
name: Workflow Security Linter

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    paths:
      - '.github/workflows/**'
  # Drift is not only introduced by editing a workflow file. An action bump
  # merged from a branch that does not touch .github/workflows/** (or a
  # lockfile regenerated by hand) leaves the tree inconsistent until somebody
  # next edits a workflow — which can be months. A weekly sweep catches that
  # without waiting for an edit. workflow_dispatch covers "I just want to
  # check now".
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # The duplicate-key and lockfile-drift checkers are the estate's shared
      # implementations (hyperpolymath/standards). They are fetched at a pinned
      # SHA rather than re-implemented here: this repo's whole reason for using
      # a shared governance bundle is to NOT carry per-repo copies of gates.
      - name: Checkout standards for the shared check scripts
        uses: actions/checkout@v7.0.1
        with:
          repository: hyperpolymath/standards
          ref: a9a3281d620bdd195369c9a6f0bc1d661910965a
          path: .standards-checkout
          # Directory form, non-cone: the same shape five green jobs in
          # governance-reusable.yml use to fetch standards' scripts/.
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # ── Why this check was red on main ────────────────────────────────────
      # It tested `head -1 "$f"` for the SPDX identifier. `gh actions-lock`
      # INSERTS `# This workflow is managed by gh actions-lock.` at line 1
      # whenever it mints or refreshes a lockfile, which pushes the identifier
      # to line 2 — so the check failed on all 14 workflow files at once, and
      # would re-fail on every future lockfile refresh. The estate's own
      # governance bundle hit this first and documents it at length; this check
      # now uses the same "scan the leading comment block" idiom.
      - name: Check SPDX headers
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! awk '/^---[[:space:]]*$/ { next } /^#/ { print; next } { exit }' "$f" \
                 | grep -q "^# SPDX-License-Identifier:"; then
              echo "ERROR: $f has no SPDX-License-Identifier in its header comment block"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -ne 0 ]; then
            echo "$errors workflow file(s) missing an SPDX header"
            echo "Put '# SPDX-License-Identifier: <spdx>' anywhere in the leading comment block."
            exit 1
          fi
          echo "All workflows carry an SPDX header"

      - name: Check permissions declaration
        run: |
          errors=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q "^permissions:" "$f"; then
              echo "ERROR: $f missing permissions declaration"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -ne 0 ]; then
            echo "$errors workflow file(s) missing a top-level 'permissions:' declaration"
            exit 1
          fi
          echo "All workflows declare permissions"

      # ── Why this check exists ─────────────────────────────────────────────
      # GitHub Actions REJECTS a workflow containing duplicate YAML mapping
      # keys. The run is `failure` with no jobs, no log and no check run —
      # nothing else in CI can see it, and an ordinary YAML parser silently
      # keeps the LAST duplicate and reports success, so every other lint
      # passes. That is exactly how generator-generic-ossf-slsa3-publish.yml
      # carried a duplicated `actions:`/`contents:` pair in its provenance
      # job's permissions block and looked healthy.
      - name: Check for duplicate YAML keys
        run: |
          set -euo pipefail
          SCRIPT=.standards-checkout/scripts/check-workflow-duplicate-keys.sh
          cp "$SCRIPT" "$RUNNER_TEMP/dupkeys.sh"
          bash "$RUNNER_TEMP/dupkeys.sh" .github/workflows

      # ── Why this check exists ─────────────────────────────────────────────
      # The estate's recurring CI killer. Dependabot bumps an action version
      # in a workflow file; nobody regenerates .github/workflows/actions.lock;
      # the workflow then requests a version the lockfile does not record, and
      # GitHub rejects that workflow at `startup_failure` with ZERO jobs — no
      # log, no annotation, nothing in REST or GraphQL. It is self-reinflicting:
      # any repo with Dependabot AND a lockfile AND no regeneration step
      # re-acquires the fault on every action bump. This is precisely what
      # killed `CodeQL Advanced` here: codeql.yml moved to
      # github/codeql-action@v4.38.2 while actions.lock still recorded
      # v4.38.0. Every other workflow in the repo stayed alive, which is why
      # only CodeQL was red.
      - name: Check actions.lock is not drifted
        run: |
          set -euo pipefail
          SCRIPT=.standards-checkout/scripts/check-lockfile-drift.sh
          cp "$SCRIPT" "$RUNNER_TEMP/drift.sh"
          bash "$RUNNER_TEMP/drift.sh" .
          echo "actions.lock is in step with the workflows"

      # A lockfile that is present but has no entry for a workflow is the same
      # class of fault as drift, and the drift checker above does not cover it.
      - name: Check every workflow is covered by actions.lock
        run: |
          set -euo pipefail
          missing=0
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in actions.lock) continue ;; esac
            if ! grep -qF "'$f':" .github/workflows/actions.lock; then
              echo "ERROR: $f has no entry in .github/workflows/actions.lock"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Run 'gh actions-lock' and commit the regenerated lockfile."
            exit 1
          fi
          echo "Every workflow is covered by actions.lock"

      # This repo pins through the lockfile: the workflow carries the readable
      # ref and actions.lock records the commit it resolves to (that is what
      # `gh actions-lock` maintains). So a tag ref here is NOT a defect — it is
      # the design. The gate that matters is therefore "does the lockfile still
      # cover and match the workflows", enforced by the two steps above. If the
      # lockfile is ever removed, inline full-length SHA pins become mandatory
      # and this step starts enforcing them.
      - name: Check pinned actions
        run: |
          set -euo pipefail
          if [ -f .github/workflows/actions.lock ]; then
            echo "actions.lock present - refs are pinned via the lockfile (see the drift check above)"
          else
            # Local `./` actions and container images have no lockfile entry.
            # The image scheme is assembled from two literals on purpose: a
            # bare `docker` scheme written out in full here reads as a
            # tag-pinned image to any container scanner (Hypatia RE004), and
            # there is no image.
            local_re='uses:[[:space:]]+\./'
            image_re="uses:[[:space:]]+""docker://"
            # grep exits 1 for "no match" -- the good case -- and >=2 for a
            # real error. Swallowing that with a forced success would collapse
            # the two and let a genuine failure read as "everything is
            # pinned", so the status is captured and asserted instead
            # (Hypatia RE005).
            set +e
            unpinned=$(grep -rnE --include='*.yml' --include='*.yaml' \
              "^[[:space:]]*uses:" .github/workflows/ \
              | grep -v "@[a-f0-9]\{40\}" \
              | grep -v -e "$local_re" -e "$image_re")
            scan_rc=$?
            set -e
            if [ "$scan_rc" -ge 2 ]; then
              echo "ERROR: could not scan for unpinned refs (grep exit $scan_rc)"
              exit 1
            fi
            if [ -n "$unpinned" ]; then
              echo "ERROR: no .github/workflows/actions.lock in this tree, and these refs are not SHA-pinned:"
              echo "$unpinned"
              echo "Run 'gh actions-lock' (preferred - it also locks the transitive"
              echo "dependencies of composite actions) or pin each ref to a full commit SHA."
              exit 1
            fi
            echo "All actions are SHA-pinned"
          fi

      - name: Clean up standards checkout
        if: always()
        run: rm -rf .standards-checkout
