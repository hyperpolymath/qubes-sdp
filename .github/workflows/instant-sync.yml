# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync

on:
  push:
    branches: [main, master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Propagation
        # SHA-pinned, unlike the rest of this repository's workflows. Those pin
        # through `.github/workflows/actions.lock`, which records the commit a
        # readable tag resolves to. This one is a dispatch trigger whose whole
        # purpose is to move trust across a repository boundary, so it carries
        # its own immutable ref rather than borrowing the lockfile's. The
        # lockfile entry stays in tag form on purpose: `gh actions-lock` treats
        # that mismatch as the advisory `sha-as-ref` category, and the drift
        # check compares a 40-hex ref against the lock's `commit:` digest.
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }

      - name: Confirm
        run: echo "::notice::Propagation triggered for ${{ github.event.repository.name }}"
